<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080807">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23080807'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='%2300e5ff' font-family='Georgia,serif' font-weight='300'>m</text></svg>">
  <title>NO SIGNAL — m.code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #080807;
      --text:   #f0efe9;
      --muted:  #56534a;
      --accent: #00e5ff;
      --red:    #ff2d55;
      --serif:  'Cormorant Garamond', Georgia, serif;
      --mono:   'SF Mono', 'Fira Code', 'Consolas', monospace;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      overflow: hidden;
      cursor: crosshair;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* static noise */
    .static {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      opacity: 0.16;
      pointer-events: none;
    }

    /* scan lines */
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px);
    }

    .frame {
      position: relative; z-index: 1;
      text-align: center;
      padding: 0 24px;
    }

    .status {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--red);
      margin-bottom: 48px;
    }
    .status::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--red);
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }

    h1 {
      font-size: clamp(56px, 13vw, 170px);
      font-weight: 300; font-style: italic;
      letter-spacing: -0.02em; line-height: 0.9;
      position: relative; display: inline-block;
      white-space: nowrap;
    }
    h1::before, h1::after {
      content: attr(data-text);
      position: absolute; inset: 0;
      white-space: nowrap;
      pointer-events: none;
      color: var(--text);
    }
    h1::before { animation: g1 0.9s steps(1) infinite; }
    h1::after  { animation: g2 1.3s steps(1) infinite; }
    @keyframes g1 {
      0%   { clip-path: inset(10% 0 85% 0); transform: translateX(6px); }
      25%  { clip-path: inset(55% 0 35% 0); transform: translateX(-7px); }
      50%  { clip-path: inset(30% 0 60% 0); transform: translateX(5px); }
      75%  { clip-path: inset(75% 0 15% 0); transform: translateX(-5px); }
    }
    @keyframes g2 {
      0%   { clip-path: inset(45% 0 45% 0); transform: translateX(-9px); }
      33%  { clip-path: inset(15% 0 75% 0); transform: translateX(8px); }
      66%  { clip-path: inset(70% 0 20% 0); transform: translateX(-6px); }
    }

    .code {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
      color: var(--muted); margin-top: 36px;
      text-transform: uppercase;
    }

    .return {
      display: inline-block; margin-top: 64px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent); text-decoration: none;
      border: 1px solid rgba(0, 229, 255, 0.25);
      padding: 14px 28px;
      transition: background 0.2s, color 0.2s;
    }
    .return:hover { background: var(--accent); color: var(--bg); }

    @media (prefers-reduced-motion: reduce) {
      h1::before, h1::after, .status::before { animation: none; }
      h1::before { clip-path: inset(30% 0 68% 0); transform: translateX(3px); }
      h1::after  { clip-path: inset(65% 0 28% 0); transform: translateX(-3px); }
    }
  </style>
</head>
<body>

  <canvas class="static" aria-hidden="true"></canvas>

  <main class="frame">
    <span class="status">SIGNAL LOST</span>
    <h1 data-text="No Signal">No Signal</h1>
    <p class="code">ERR 404 &mdash; this frequency carries no transmission</p>
    <a class="return" href="https://mcode-visuals.github.io/">Return to transmission &rarr;</a>
  </main>

  <script>
    'use strict';
    // TV static — low-res noise, upscaled, ~12fps
    const c = document.querySelector('.static');
    const ctx = c.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function size() {
      c.width = Math.ceil(innerWidth / 4);
      c.height = Math.ceil(innerHeight / 4);
    }
    size();
    addEventListener('resize', size);

    function frame() {
      const img = ctx.createImageData(c.width, c.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    frame();
    if (!reduced) setInterval(frame, 80);
  </script>
</body>
</html>
